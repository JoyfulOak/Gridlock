# Gridlock Hyprland starter config for FreeBSD.
# Copy to ~/.config/gridlock/hyprland.conf and install Waybar separately.
# Install the bundled bar config as waybar.jsonc and waybar.css in the same
# Gridlock config directory; put gridlock-network-status on PATH.
# Gridlock's window controls use Hyprland's IPC socket.

$mod = SUPER
$terminal = xterm

exec-once = waybar -c ~/.config/gridlock/waybar.jsonc -s ~/.config/gridlock/waybar.css

general {
    gaps_in = 5
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(b7c4d4ff)
    col.inactive_border = rgba(292d34ff)
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96
}

animations {
    enabled = yes
}

input {
    kb_layout = us
    follow_mouse = 1
}

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod SHIFT, Space, togglefloating
bind = $mod, Left, exec, gridlock window focus left
bind = $mod, Right, exec, gridlock window focus right
bind = $mod, Up, exec, gridlock window focus up
bind = $mod, Down, exec, gridlock window focus down
bind = $mod SHIFT, Left, exec, gridlock window move left
bind = $mod SHIFT, Right, exec, gridlock window move right
bind = $mod SHIFT, Up, exec, gridlock window move up
bind = $mod SHIFT, Down, exec, gridlock window move down

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
