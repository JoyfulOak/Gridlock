# Gridlock starter configuration for Sway.
# Copy this into ~/.config/gridlock/sway.conf before starting the session.
set $mod Mod4

# FreeBSD Wayland input mapping used by the documented Sway setup.
input * xkb_rules evdev

bindsym $mod+Left exec gridlock window focus left
bindsym $mod+Right exec gridlock window focus right
bindsym $mod+Up exec gridlock window focus up
bindsym $mod+Down exec gridlock window focus down

bindsym $mod+Shift+Left exec gridlock window move left
bindsym $mod+Shift+Right exec gridlock window move right
bindsym $mod+Shift+Up exec gridlock window move up
bindsym $mod+Shift+Down exec gridlock window move down

bindsym $mod+Return exec gridlock terminal
bindsym $mod+q exec gridlock window close
bindsym $mod+f exec gridlock window fullscreen
bindsym $mod+Shift+space exec gridlock window floating
bindsym $mod+Shift+e exit

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9

bar {
    position top
    status_command gridlock-shell
    colors {
        statusline #e6e8eb
        background #17191d
        focused_workspace #17191d #30343b #ffffff
        active_workspace #17191d #24272d #c9cdd3
        inactive_workspace #17191d #17191d #858b95
        urgent_workspace #7a2c35 #7a2c35 #ffffff
    }
}
